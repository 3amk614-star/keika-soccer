<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEIKA 3つの背景写真変更</title><style>body{margin:0;background:#06182b;color:#fff;font:16px system-ui,sans-serif}main{max-width:860px;margin:auto;padding:24px}h1{color:#80d9ff}section{padding:18px;background:#112b43;border-radius:12px;margin:18px 0}img{display:block;width:100%;max-height:250px;object-fit:contain;background:#05101d;margin:12px 0}input{display:block;margin:12px 0}button{padding:12px 20px;background:#83dfff;border:0;border-radius:8px;font-weight:bold;cursor:pointer}a{color:#83dfff}p{line-height:1.8}</style><main><h1>背景写真の変更</h1><p>3つの欄に使いたい写真を選び、「写真を保存」を押してください。保存したファイルをサイトの <b>assets</b> フォルダに同名で上書きし、サイトを再公開すると反映されます。写真の画像内容は加工しません。</p><div id="areas"></div><p>※この画面で写真を選ぶだけでは公開中のサイトは変更されません。アップロードが必要です。</p><a href="index.html">ホームページに戻る</a></main><script>const defs=[["team","凡事徹底"],["football","シャープな旨みでエッジの効いたサッカー"],["philosophy","活動理念"]];const box=document.getElementById('areas');defs.forEach(([id,label])=>{const name='concept-'+id+'.jpg';const sec=document.createElement('section');sec.innerHTML='<h2>'+label+'</h2><img alt="現在の背景" src="assets/'+name+'"><input type="file" accept="image/jpeg,image/png,image/webp"><button disabled>写真を保存</button><p>保存先：assets/'+name+'</p>';box.append(sec);const input=sec.querySelector('input'),btn=sec.querySelector('button'),img=sec.querySelector('img');let blob=null;input.onchange=async()=>{const file=input.files[0];if(!file)return;const bmp=await createImageBitmap(file);const canvas=document.createElement('canvas');canvas.width=bmp.width;canvas.height=bmp.height;canvas.getContext('2d').drawImage(bmp,0,0);blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.94));img.src=URL.createObjectURL(blob);btn.disabled=false};btn.onclick=()=>{if(!blob)return;const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}})</script></html>
