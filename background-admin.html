<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KEIKA 背景設定</title><style>body{font-family:system-ui,sans-serif;background:#06182b;color:white;margin:0;padding:24px}main{max-width:850px;margin:auto}h1{color:#8de0ff}p{line-height:1.8}label{display:block;margin:15px 0 7px}select,button{font:inherit;padding:12px;border-radius:8px}select{width:100%;background:white;color:#132c41}button{border:0;background:#70d7ff;color:#06182b;font-weight:bold;cursor:pointer;margin:18px 0}img{width:100%;max-height:230px;object-fit:cover;border-radius:8px}section{background:#10283e;padding:16px;margin:14px 0;border-radius:12px}.note{background:#18344a;padding:16px;border-radius:8px}a{color:#90dfff}</style><main><h1>KEIKA 背景写真の設定</h1><p>ホームページで順番に切り替わる5枚の背景写真を選択できます。写真はすべて以前ご提供いただいた実物写真です。</p><div id="slots"></div><button id="save">設定ファイルをダウンロード</button><p class="note">保存後、ダウンロードした <b>background-config.js</b> をホームページの同名ファイルと入れ替えてください。公開中のサイトでは、GitHubにこのファイルをアップロード（上書きコミット）すると変更が反映されます。<br>新しい写真を追加するときは、まずその画像を <b>assets</b> フォルダへアップロードし、下の設定ファイル内にそのファイル名を指定してください。管理画面だけで公開サイトを直接変更する機能ではありません。</p><p><a href="index.html">← ホームページに戻る</a></p></main><script src="background-config.js"></script><script>const files=Array.from({length:10},(_,i)=>`photo-${String(i+1).padStart(2,'0')}.jpg`);const defaults=window.KEIKA_BG_CONFIG?.photos||files.slice(0,5);const wrap=document.getElementById('slots');for(let i=0;i<5;i++){const box=document.createElement('section');const label=document.createElement('label');label.textContent=`背景 ${i+1}`;const sel=document.createElement('select');for(const f of files){const op=document.createElement('option');op.value=f;op.textContent=f;sel.append(op)}sel.value=defaults[i]||files[i];const img=document.createElement('img');function refresh(){img.src='assets/'+sel.value}sel.addEventListener('change',refresh);refresh();box.append(label,sel,img);wrap.append(box)}document.getElementById('save').onclick=()=>{const photos=[...document.querySelectorAll('select')].map(x=>x.value);const js='window.KEIKA_BG_CONFIG = '+JSON.stringify({photos},null,2)+';\n';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));a.download='background-config.js';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};</script></html>
